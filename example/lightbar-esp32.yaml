esphome:
  name: lightbar

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

time:
  - platform: homeassistant

spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

xiaomi_lightbar:
  cs_pin: GPIO5
  ce_pin: GPIO4

light:
  - platform: xiaomi_lightbar
    name: Light bar
    serial: 0x123456
    remotes:
      - 0xABCDEF
    pair:
      name: Pair
    calibrate_on:
      name: "Calibrate: bar is on"
    calibrate_off:
      name: "Calibrate: bar is off"
    resend:
      name: "Calibrate: resend brightness and temperature"
    auto_calibrate:
      enabled:
        name: Daily calibration
      time:
        name: Daily calibration time
        initial_value: "04:00"
      quiet_minutes:
        name: Daily calibration quiet minutes
        initial_value: 60

event:
  - platform: xiaomi_lightbar
    name: Remote
    serial: 0xABCDEF

sensor:
  - platform: wifi_signal
    name: WiFi signal
    entity_category: diagnostic
    update_interval: 60s
    on_value:
      - text_sensor.template.publish:
          id: wifi_signal_quality
          state: !lambda |-
            if (x >= -50) return "Excellent";
            if (x >= -60) return "Good";
            if (x >= -70) return "Fair";
            if (x >= -80) return "Weak";
            return "Bad";

text_sensor:
  - platform: template
    id: wifi_signal_quality
    name: WiFi signal quality
    icon: mdi:wifi
    entity_category: diagnostic
