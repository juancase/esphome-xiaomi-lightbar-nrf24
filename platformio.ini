; PC tests for the hardware-independent core of the xiaomi_lightbar component.
; Run with: pio test -e native

[platformio]
src_dir = components/xiaomi_lightbar

[env:native]
platform = native
test_framework = unity
test_build_src = yes
; Only the plain C++ core. The ESPHome glue in the same folder does not build on the PC.
build_src_filter = +<protocol.cpp> +<bar_state.cpp> +<daily_calibration.cpp>
build_flags = -std=gnu++17 -Wall -Wextra
